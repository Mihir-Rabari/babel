[project]
name = "babel"
version = "0.1.0"
description = "Live bilingual voice interpreter built on AssemblyAI Dictation API + streaming TTS"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "edge-tts>=6.1",
    "pillow>=13.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
